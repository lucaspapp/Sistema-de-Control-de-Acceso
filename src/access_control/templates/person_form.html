{% extends 'base.html' %}{% block content %}<header><div><p class="eyebrow danger">NUEVO PERFIL</p><h1>{{ 'Agregar prohibido' if kind == 'prohibited' else 'Agregar autoexcluido' }}</h1></div></header><form class="profile-form" method="post" enctype="multipart/form-data"><label>Nombre<input name="name" required></label>{% if kind == 'prohibited' %}<label>Quién informó el prohibido<input name="reported_by" required></label><label>Motivo<textarea name="reason" required rows="4"></textarea></label>{% endif %}<label>Fecha<input name="effective_date" type="date" required></label><label>Foto<input name="image" required type="file" accept="image/jpeg,image/png,image/webp"></label><button>Guardar perfil</button></form>{% endblock %}
